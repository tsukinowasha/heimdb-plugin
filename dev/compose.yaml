# プラグインの開発環境（HeimDB + WordPress + wp-cli）。
#
#   docker compose -f dev/compose.yaml up -d
#   docker compose -f dev/compose.yaml run --rm cli wp core install --url=http://localhost:8090 --title=Dev \
#     --admin_user=admin --admin_password=admin --admin_email=dev@example.com
#   docker compose -f dev/compose.yaml run --rm cli wp plugin activate heimdb
#   docker compose -f dev/compose.yaml run --rm cli wp heimdb branch list
#
# WordPress はサイトのユーザー wordpress でつなぎ、heimdb_* は wp-config.php の HEIMDB_ADMIN_* (root) で呼ぶ。
#
# ステージングのサイト（http://localhost:8091、プロファイル staging）は、ブランチ staging にブランチだけの権限のユーザー
# staging でつなぎ、管理者の設定を持たない（HeimDB の -branch-procedures で、差分、解決、復元を呼ぶ）。
#   dev/wp heimdb branch create staging
#   dev/wp heimdb branch grant staging staging --password=staging-secret
#   docker compose -f dev/compose.yaml --profile staging up -d
# ブランチ、ユーザー、パスワード、ポートは STAGING_BRANCH、STAGING_USER、STAGING_PASSWORD、STAGING_PORT で変えられる。
name: heimdb-plugin-dev

x-db: &db
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: wordpress

services:
  db:
    image: tsukinowa/heimdb:${HEIMDB_VERSION:-0.3.2}
    environment:
      HEIMDB_ROOT_PASSWORD: root-secret
      HEIMDB_SITE_PASSWORD: site-secret
      HEIMDB_BRANCH_PROCEDURES: "1"
    ports:
      - "127.0.0.1:${HEIMDB_PORT:-3317}:3306"
    volumes:
      - heimdb-data:/data

  wordpress:
    image: wordpress:php8.4-apache
    depends_on: [db]
    ports:
      - "127.0.0.1:${WP_PORT:-8090}:80"
    environment:
      <<: *db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: site-secret
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('HEIMDB_ADMIN_USER', 'root');
        define('HEIMDB_ADMIN_PASSWORD', 'root-secret');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/heimdb:ro

  staging:
    image: wordpress:php8.4-apache
    profiles: ["staging"]
    depends_on: [db]
    ports:
      - "127.0.0.1:${STAGING_PORT:-8091}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress@${STAGING_BRANCH:-staging}
      WORDPRESS_DB_USER: ${STAGING_USER:-staging}
      WORDPRESS_DB_PASSWORD: ${STAGING_PASSWORD:-staging-secret}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:${STAGING_PORT:-8091}');
        define('WP_SITEURL', 'http://localhost:${STAGING_PORT:-8091}');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/heimdb:ro

  cli:
    image: wordpress:cli-php8.4
    profiles: ["cli"]
    depends_on: [db]
    user: "33:33"
    environment:
      <<: *db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: site-secret
      WORDPRESS_CONFIG_EXTRA: |
        define('HEIMDB_ADMIN_USER', 'root');
        define('HEIMDB_ADMIN_PASSWORD', 'root-secret');
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/heimdb:ro

volumes:
  heimdb-data:
  wordpress:
